spring.application.name=webapp
spring.profiles.active=dev
server.port=8086
# spring.profiles.include=prod 
# Connect to Database 
spring.datasource.url=jdbc:postgresql://localhost:5435/webapp_db
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate Config
# spring.jpa.hibernate.ddl-auto=create-drop 
# spring.jpa.hibernate.ddl-auto=update

#Setup Hinernate ddl=none if using flyway
spring.jpa.hibernate.ddl-auto=none 
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Setup Flyway
# Không cần Setup riêng url connect đến DB cho FlyWay vì nó tự động lấy từ Spring để dùng chung.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db_migration
spring.flyway.baseline-on-migrate=true
# spring.flyway.ignore-missing-migrations=true
# spring.flyway.supported-database-versions=14



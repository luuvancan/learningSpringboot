spring.application.name=webapp
spring.profiles.active=dev
server.port=8086
# spring.profiles.include=prod 
# Connect to Database 
spring.datasource.url=jdbc:postgresql://localhost:5435/webapp_db
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate Config
# spring.jpa.hibernate.ddl-auto=create-drop 
# spring.jpa.hibernate.ddl-auto=update

#Setup Hinernate ddl=none if using flyway
spring.jpa.hibernate.ddl-auto=none 
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Setup Flyway
# Không cần Setup riêng url connect đến DB cho FlyWay vì nó tự động lấy từ Spring để dùng chung.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db\migrations
spring.flyway.baseline-on-migrate=true
# spring.flyway.ignore-missing-migrations=true
# spring.flyway.supported-database-versions=14


#Setup Redis Cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis 
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
# Use Prefix to avoid duplicate key 
spring.cache.redis.use-key-prefix=true 
spring.cache.redis.key-serializer=org.springframework.data.redis.serializer.StringRedisSerializer
spring.cache.redis.value-serializer=org.springframework.data.redis.serializer.Jackson2JsonRedisSerializer

#Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


spring.kafka.producer.acks=-1 
#0 No wait for kafka , reponse 
#1 leader write success , not wait for follower 
#-1 wait for all leader , and replication 
spring.kafka.producer.retries=1
#Send event again if fail
#Prevent Duplicate send 
spring.kafka.producer.properties.[enable.idempotence]=true
spring.kafka.producer.properties.[max.in.flight.request.per.connection]=5

